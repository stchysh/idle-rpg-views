<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>玩法</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&amp;family=Noto+Sans+SC:wght@500;700;900&amp;family=ZCOOL+QingKe+HuangYou&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0E1024;font-family:"Noto Sans SC",system-ui,sans-serif;color:#FFFFFF}
button{font-family:inherit;cursor:pointer;margin:0;padding:0;border:0;background:none;color:inherit}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column; background: #1B1F3B; font-family: 'Noto Sans SC', system-ui, sans-serif; color: #FFFFFF">
  <div style="flex-shrink: 0; height: 48px"><dc-import name="ResBar" hint-size="390px,48px"></dc-import></div>

  <div style="flex-shrink: 0; display: flex; align-items: flex-end; justify-content: space-between; padding: 12px 16px 0 16px">
    <h1 style="margin: 0; font-family: 'ZCOOL QingKe HuangYou', 'Noto Sans SC', sans-serif; font-weight: 400; font-size: 36px; line-height: 38px; letter-spacing: 2px; text-shadow: 0 3px 0 #0E1024, 0 -2px 0 #0E1024, 2px 0 0 #0E1024, -2px 0 0 #0E1024">玩法</h1>
    <span style="font-size: 12px; font-weight: 700; color: #C9CDF2">挑战次数 05:00 重置</span>
  </div>

  <div role="tablist" style="flex-shrink: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; padding: 10px 16px 0 16px">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="2">
      <button role="tab" aria-selected="{{t.on}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
    </sc-for>
  </div>

  <div style="flex-grow: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; padding: 12px 16px 16px 16px; display: flex; flex-direction: column; gap: 12px">
    <sc-for list="{{cards}}" as="c" hint-placeholder-count="6">
      <div style="{{c.card}}">
        <div style="{{c.band}}">
          <svg width="120" height="96" viewBox="0 0 120 96" style="position: absolute; right: -6px; bottom: -8px; opacity: 0.35">
            <path d="{{c.d}}" transform="scale(4.2)" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
          <span style="position: relative; font-family: 'ZCOOL QingKe HuangYou', 'Noto Sans SC', sans-serif; font-size: 26px; line-height: 28px; text-shadow: 0 2px 0 #0E1024, 0 -1px 0 #0E1024, 1px 0 0 #0E1024, -1px 0 0 #0E1024">{{c.name}}</span>
          <span style="position: relative; font-size: 12px; font-weight: 700; text-shadow: 0 1px 0 #0E1024">{{c.desc}}</span>
          <span style="{{c.tagStyle}}">{{c.tag}}</span>
        </div>
        <div style="display: flex; align-items: center; gap: 8px; padding: 10px 10px 10px 12px">
          <div style="flex-grow: 1; min-width: 0; display: flex; flex-wrap: wrap; gap: 4px">
            <sc-for list="{{c.rewards}}" as="rw" hint-placeholder-count="3">
              <span style="padding: 0 8px; height: 22px; line-height: 22px; border-radius: 11px; background: #0E1024; font-size: 11px; font-weight: 700; color: #C9CDF2">{{rw}}</span>
            </sc-for>
          </div>
          <sc-if value="{{c.open}}" hint-placeholder-val="{{true}}">
            <a href="Battle.dc.html" style="flex-shrink: 0; height: 44px; padding: 0 16px; border-radius: 12px; background: #3DDC84; color: #0E1024; border: 3px solid #0E1024; box-shadow: 0 3px 0 #0E1024; box-sizing: border-box; display: flex; align-items: center; font-size: 15px; font-weight: 900; text-decoration: none">前往</a>
          </sc-if>
          <sc-if value="{{c.locked}}" hint-placeholder-val="{{false}}">
            <span style="flex-shrink: 0; height: 44px; padding: 0 12px; border-radius: 12px; background: #40467A; color: #C9CDF2; border: 3px solid #0E1024; box-sizing: border-box; display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#C9CDF2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11 V8 A4 4 0 0 1 16 8 V11"></path></svg>{{c.lockText}}
            </span>
          </sc-if>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="flex-shrink: 0; height: 84px"><dc-import name="NavBar" active="modes" hint-size="390px,84px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'challenge' };
  }
  renderVals() {
    var self = this;
    var ICON = {
      target: 'M12 3 A9 9 0 1 0 12.01 3 Z M12 7 A5 5 0 1 0 12.01 7 Z M12 11 V13',
      infinity: 'M6 8 A4 4 0 1 0 6 16 C9 16 15 8 18 8 A4 4 0 1 1 18 16 C15 16 9 8 6 8 Z',
      skull: 'M5 11 A7 7 0 0 1 19 11 V15 H16 V19 H8 V15 H5 Z M9 11 H9.5 M14.5 11 H15',
      trophy: 'M7 4 H17 V9 A5 5 0 0 1 7 9 Z M12 14 V18 M8 21 H16',
      castle: 'M4 21 V9 H7 V12 H10 V9 H14 V12 H17 V9 H20 V21 Z M10 21 V16 H14 V21',
      flag: 'M5 21 V3 M5 4 H18 L15 8 L18 12 H5',
      pumpkin: 'M12 6 C4 6 3 20 12 20 C21 20 20 6 12 6 Z M12 6 V3 M9 11 L10 13 M15 11 L14 13 M9 16 H15',
      coin: 'M12 3 A9 9 0 1 0 12.01 3 Z M12 7 V17 M9 9 H14 M9 15 H14',
      dragon: 'M4 18 Q8 4 20 6 Q14 9 16 12 Q10 12 12 18 Z'
    };
    var challenge = [
      { name: '每日挑战', desc: '特殊词缀关卡，每天轮换规则', tag: '剩余 2/3', color: '#E84A5F', d: ICON.target, rewards: ['金币 ×30K', '史诗图纸', '钻石 ×50'] },
      { name: '无尽模式', desc: '怪物无限增强，看你能撑多久', tag: '最佳 23:41', color: '#4F8BFF', d: ICON.infinity, rewards: ['排行榜', '无尽宝箱'] },
      { name: '精英关卡', desc: '强化版章节 Boss，掉落传说碎片', tag: '剩余 3/3', color: '#B06CFF', d: ICON.skull, rewards: ['传说碎片', '强化石 ×20'] },
      { name: '竞技场', desc: '与其他幸存者比拼生存时长', tag: '白银 II', color: '#FF8A3D', d: ICON.trophy, rewards: ['竞技币', '赛季头像框'] },
      { name: '公会副本', desc: '与公会成员合力讨伐巨兽', tag: '需加入公会', color: '#2FB36B', d: ICON.castle, rewards: ['公会币', '神话碎片'], lock: '第 5 章解锁' },
      { name: '远征', desc: '连续闯关，途中收集遗物', tag: '即将开放', color: '#3A7CA5', d: ICON.flag, rewards: ['遗物', '远征币'], lock: '等级 50 解锁' }
    ];
    var events = [
      { name: '万圣狂欢', desc: '击败南瓜怪收集糖果兑换限定皮肤', tag: '剩余 6天', color: '#FF8A3D', d: ICON.pumpkin, rewards: ['限定皮肤', '南瓜头像'] },
      { name: '周末双倍', desc: '所有章节金币与经验掉落翻倍', tag: '剩余 1天8时', color: '#E0A020', d: ICON.coin, rewards: ['金币 ×2', '经验 ×2'] },
      { name: '世界 Boss', desc: '全服玩家共同挑战远古巨龙', tag: '20:00 开启', color: '#D93C4A', d: ICON.dragon, rewards: ['伤害排名奖励', '龙鳞'], lock: '20:00 开启' },
      { name: '限时挑战', desc: '只允许使用近战武器的特殊关卡', tag: '剩余 3天', color: '#8E4FE0', d: ICON.skull, rewards: ['史诗宝箱', '钻石 ×100'] }
    ];
    var tab = this.state.tab;
    var list = (tab === 'challenge' ? challenge : events).map(function (c) {
      var locked = !!c.lock;
      return Object.assign({}, c, {
        open: !locked, locked: locked, lockText: c.lock || '',
        card: 'flex-shrink: 0; border-radius: 18px; background: #2E3570; border: 3px solid #0E1024; box-shadow: 0 4px 0 #0E1024; overflow: hidden;' + (locked ? ' opacity: 0.85;' : ''),
        band: 'position: relative; height: 92px; overflow: hidden; box-sizing: border-box; padding: 12px 14px; display: flex; flex-direction: column; justify-content: center; gap: 4px; border-bottom: 3px solid #0E1024; background: ' + (locked ? '#40467A' : c.color) + ';',
        tagStyle: 'position: absolute; right: 10px; top: 10px; padding: 0 8px; height: 22px; line-height: 22px; border-radius: 11px; background: #0E1024; font-size: 11px; font-weight: 700; color: #FFE08A;'
      });
    });
    var tabs = [ ['challenge', '挑战'], ['event', '活动'] ].map(function (d) {
      var on = d[0] === tab;
      return {
        label: d[1], on: on ? 'true' : 'false',
        pick: function () { self.setState({ tab: d[0] }); },
        style: 'height: 40px; border-radius: 12px; border: 3px solid #0E1024; box-sizing: border-box; font-size: 15px; font-weight: 900; ' + (on ? 'background: #FFC93C; color: #3A2400; box-shadow: 0 3px 0 #7A4A00;' : 'background: #2E3570; color: #C9CDF2; box-shadow: 0 3px 0 #0E1024;')
      };
    });
    return { tabs: tabs, cards: list };
  }
}
</script>
</body>
</html>
