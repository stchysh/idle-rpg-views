<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>底部导航</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&amp;family=Noto+Sans+SC:wght@500;700;900&amp;family=ZCOOL+QingKe+HuangYou&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<nav aria-label="主导航" style="width: 390px; height: 84px; box-sizing: border-box; padding: 0 8px 10px 8px; background: #0E1024; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: end; gap: 4px; border-top: 3px solid #2E3570; font-family: 'Noto Sans SC', system-ui, sans-serif; color: #FFFFFF">
  <a href="Shop.dc.html" aria-label="商店" style="{{tabs.shop.style}}">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="{{tabs.shop.ink}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8 H20 L19 21 H5 Z"></path><path d="M8 8 V6 A4 4 0 0 1 16 6 V8"></path></svg>
    <span style="font-size: 12px; font-weight: 900; color: {{tabs.shop.ink}}">商店</span>
    <span style="position: absolute; top: 6px; right: 14px; width: 12px; height: 12px; border-radius: 50%; background: #FF4D4F; border: 2px solid #0E1024; box-sizing: border-box"></span>
  </a>
  <a href="Gear.dc.html" aria-label="装备" style="{{tabs.gear.style}}">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="{{tabs.gear.ink}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 L20 6 V11 C20 16 16.5 19.5 12 21 C7.5 19.5 4 16 4 11 V6 Z"></path><path d="M12 8 V16 M8 12 H16"></path></svg>
    <span style="font-size: 12px; font-weight: 900; color: {{tabs.gear.ink}}">装备</span>
    <span style="position: absolute; top: 6px; right: 14px; width: 12px; height: 12px; border-radius: 50%; background: #FF4D4F; border: 2px solid #0E1024; box-sizing: border-box"></span>
  </a>
  <a href="Main.dc.html" aria-label="战斗" style="{{tabs.battle.style}}">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="{{tabs.battle.ink}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4 L14 14 M4 4 H8 L16 12 M4 4 V8 L12 16"></path><path d="M20 4 L10 14 M20 4 H16 M20 4 V8"></path><path d="M13 17 L17 13 M15 19 L19 15 M17 17 L20 20 M7 17 L11 13 M9 19 L5 15 M7 17 L4 20"></path></svg>
    <span style="font-size: 13px; font-weight: 900; color: {{tabs.battle.ink}}">战斗</span>
  </a>
  <a href="Evolve.dc.html" aria-label="进化" style="{{tabs.evolve.style}}">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="{{tabs.evolve.ink}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20 V8 M7 12 L12 7 L17 12"></path><path d="M5 4 H19"></path></svg>
    <span style="font-size: 12px; font-weight: 900; color: {{tabs.evolve.ink}}">进化</span>
    <span style="position: absolute; top: 6px; right: 14px; width: 12px; height: 12px; border-radius: 50%; background: #FF4D4F; border: 2px solid #0E1024; box-sizing: border-box"></span>
  </a>
  <a href="Modes.dc.html" aria-label="玩法" style="{{tabs.modes.style}}">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="{{tabs.modes.ink}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4 H17 V9 A5 5 0 0 1 7 9 Z"></path><path d="M7 6 H4 V8 A3 3 0 0 0 7 11 M17 6 H20 V8 A3 3 0 0 1 17 11 M12 14 V18 M8 21 H16 M9 18 H15"></path></svg>
    <span style="font-size: 12px; font-weight: 900; color: {{tabs.modes.ink}}">玩法</span>
  </a>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["shop","gear","battle","evolve","modes"],"default":"battle"},"$preview":{"width":390,"height":84}}'>
class Component extends DCLogic {
  renderVals() {
    var active = this.props.active ?? 'battle';
    var mk = function (id, big) {
      var on = active === id;
      var base = 'position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; box-sizing: border-box; border-radius: 16px; text-decoration: none; color: inherit;';
      var style = on
        ? base + ' height: ' + (big ? 82 : 74) + 'px; transform: translateY(-8px); background: #FFC93C; border: 3px solid #0E1024; box-shadow: 0 4px 0 #7A4A00;'
        : base + ' height: 60px; background: transparent; border: 3px solid transparent;';
      return { style: style, ink: on ? '#3A2400' : '#8E94C8' };
    };
    return { tabs: { shop: mk('shop'), gear: mk('gear'), battle: mk('battle', true), evolve: mk('evolve'), modes: mk('modes') } };
  }
}
</script>
</body>
</html>
