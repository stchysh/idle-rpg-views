<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>任务与成就</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&amp;family=Noto+Serif+SC:wght@600;900&amp;family=ZCOOL+XiaoWei&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#1E120A;font-family:"Noto Serif SC",serif;color:#2A1A0E}
button{font-family:inherit;cursor:pointer;margin:0;padding:0;border:0;background:none;color:inherit}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column; background: #2A1A0E; font-family: 'Noto Serif SC', serif; color: #2A1A0E">
  <div style="flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 12px 14px 0 14px">
    <a href="Main.dc.html" aria-label="返回地图" style="width: 44px; height: 44px; border-radius: 10px; background: #5C3A21; border: 2px solid #A8741A; box-sizing: border-box; display: flex; align-items: center; justify-content: center; text-decoration: none">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F3E4C0" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 L8 12 L15 19"></path></svg>
    </a>
    <h1 style="margin: 0; flex-grow: 1; font-family: 'ZCOOL XiaoWei', serif; font-weight: 400; font-size: 26px; color: #FFE7A3; text-shadow: 0 2px 0 #000000">任务告示板</h1>
    <span style="font-size: 12px; font-weight: 600; color: #C9A96A">{{reset}}</span>
  </div>

  <div role="tablist" style="flex-shrink: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; padding: 12px 12px 0 12px">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
      <button role="tab" aria-selected="{{t.on}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
    </sc-for>
  </div>

  <!-- 活跃度 -->
  <div style="flex-shrink: 0; margin: 10px 12px 0 12px; border-radius: 12px; background: #5C3A21; border: 3px solid #A8741A; padding: 10px 12px 6px 12px; display: flex; flex-direction: column; gap: 6px; color: #F3E4C0">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <span style="font-size: 13px; font-weight: 900">王国声望</span>
      <span style="font-family: 'Cinzel', serif; font-weight: 900; font-size: 18px; color: #FFE7A3">{{points}}<span style="font-size: 12px; color: #C9A96A"> / 100</span></span>
    </div>
    <div style="position: relative; height: 66px">
      <div style="position: absolute; left: 0; right: 22px; top: 18px; height: 10px; border-radius: 5px; background: #2A1A0E; overflow: hidden">
        <div style="width: {{points}}%; height: 100%; background: #E9B949"></div>
      </div>
      <sc-for list="{{marks}}" as="m" hint-placeholder-count="4">
        <div style="{{m.pos}}">
          <span style="{{m.box}}">
            <svg width="24" height="22" viewBox="0 0 24 22"><path d="M2 9 H22 V20 H2 Z" fill="{{m.body}}" stroke="#2A1A0E" stroke-width="2"></path><path d="M2 10 Q2 3 12 3 Q22 3 22 10 Z" fill="{{m.lid}}" stroke="#2A1A0E" stroke-width="2" stroke-linejoin="round"></path></svg>
          </span>
          <span style="font-family: 'Cinzel', serif; font-weight: 900; font-size: 11px; color: #E2CB98">{{m.at}}</span>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="flex-grow: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; padding: 10px 12px 20px 12px; display: flex; flex-direction: column; gap: 8px">
    <sc-for list="{{list}}" as="q" hint-placeholder-count="8">
      <div style="{{q.card}}">
        <span style="{{q.tile}}">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFF3D6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="{{q.d}}"></path></svg>
        </span>
        <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
          <span style="font-size: 14px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{q.name}}</span>
          <div style="display: flex; align-items: center; gap: 6px">
            <div style="flex-grow: 1; height: 8px; border-radius: 4px; background: #C9A96A; overflow: hidden"><div style="{{q.bar}}"></div></div>
            <span style="font-family: 'Cinzel', serif; font-weight: 900; font-size: 11px; white-space: nowrap">{{q.prog}}</span>
          </div>
          <span style="font-size: 11px; font-weight: 600; color: #6B4226">{{q.reward}}</span>
        </div>
        <sc-if value="{{q.canClaim}}" hint-placeholder-val="{{false}}">
          <button onClick="{{q.claim}}" style="width: 68px; height: 44px; flex-shrink: 0; border-radius: 10px; background: #E9B949; border: 2px solid #2A1A0E; box-shadow: 0 2px 0 #2A1A0E; box-sizing: border-box; font-size: 14px; font-weight: 900">领取</button>
        </sc-if>
        <sc-if value="{{q.canGo}}" hint-placeholder-val="{{true}}">
          <a href="{{q.href}}" style="width: 68px; height: 44px; flex-shrink: 0; border-radius: 10px; background: #2F6FB0; color: #FFF3D6; border: 2px solid #2A1A0E; box-shadow: 0 2px 0 #2A1A0E; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 900; text-decoration: none">前往</a>
        </sc-if>
        <sc-if value="{{q.done}}" hint-placeholder-val="{{false}}">
          <span style="width: 68px; height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: center">
            <svg width="44" height="44" viewBox="0 0 44 44"><circle cx="22" cy="22" r="18" fill="none" stroke="#A8322A" stroke-width="3"></circle><path d="M13 22 L20 29 L32 15" fill="none" stroke="#A8322A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          </span>
        </sc-if>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'daily', got: { d0: true, d1: true } };
  }
  renderVals() {
    var self = this;
    var I = {
      sword: 'M4 4 L14 14 M4 4 H8 L16 12 M4 4 V8 L12 16 M20 4 L10 14 M20 4 H16 M20 4 V8',
      tower: 'M6 21 V9 H9 V12 H11 V9 H13 V12 H15 V9 H18 V21 Z M10 21 V16 H14 V21',
      star: 'M12 2 L14.9 8.6 L22 9.3 L16.6 14 L18.2 21 L12 17.3 L5.8 21 L7.4 14 L2 9.3 L9.1 8.6 Z',
      skull: 'M5 11 A7 7 0 0 1 19 11 V15 H16 V19 H8 V15 H5 Z',
      helm: 'M5 20 V11 A7 7 0 0 1 19 11 V20 H14 V14 H10 V20 Z',
      fire: 'M14 10 A5 5 0 1 0 14.01 10 M10 6 L3 3 M9 11 L2 12 M12 14 L6 20',
      gem: 'M6 3 H18 L22 9 L12 21 L2 9 Z',
      flag: 'M6 21 V4 M6 5 H17 L14 9 L17 13 H6',
      hammer: 'M14 4 L20 10 L17 13 L11 7 Z M12.5 8.5 L4 17 L7 20 L15.5 11.5'
    };
    var DATA = {
      daily: [
        ['登录游戏', I.flag, '#4E8A3A', 1, 1, 10, '声望 +10 · 金币 ×500', 'Main.dc.html'],
        ['通关任意关卡 2 次', I.sword, '#A8322A', 2, 2, 20, '声望 +20 · 钻石 ×10', 'StageInfo.dc.html'],
        ['建造 30 座防御塔', I.tower, '#8A5A32', 30, 30, 20, '声望 +20 · 冰冻 ×1', 'Battle.dc.html'],
        ['消灭 500 个敌人', I.skull, '#4A3A48', 500, 500, 20, '声望 +20 · 经验书 ×2', 'Battle.dc.html'],
        ['使用火雨法术 5 次', I.fire, '#C4552A', 3, 5, 10, '声望 +10 · 炸药 ×1', 'Battle.dc.html'],
        ['升级任意英雄 1 次', I.helm, '#2F6FB0', 0, 1, 10, '声望 +10 · 经验书 ×3', 'Heroes.dc.html'],
        ['研究 1 项科技', I.hammer, '#6B5A45', 0, 1, 10, '声望 +10 · 星星碎片 ×1', 'Tech.dc.html'],
        ['进行 1 次英雄招募', I.star, '#7A4BB0', 0, 1, 10, '声望 +10 · 钻石 ×20', 'Summon.dc.html']
      ],
      weekly: [
        ['本周获得 15 颗星星', I.star, '#E9B949', 12, 15, 30, '钻石 ×100', 'Main.dc.html'],
        ['完成 3 次钢铁挑战', I.sword, '#A8322A', 1, 3, 30, '史诗碎片 ×5', 'StageInfo.dc.html'],
        ['消灭 5,000 个敌人', I.skull, '#4A3A48', 5000, 5000, 20, '天罚陨石 ×1', 'Battle.dc.html'],
        ['消费 1,000 钻石', I.gem, '#3E8FB8', 480, 1000, 20, '招募券 ×1', 'Shop.dc.html']
      ],
      achieve: [
        ['通关第一章', I.flag, '#4E8A3A', 7, 10, 0, '称号「林地守护者」', 'Main.dc.html'],
        ['收集 30 颗星星', I.star, '#E9B949', 30, 30, 0, '钻石 ×200', 'Main.dc.html'],
        ['拥有 5 名英雄', I.helm, '#2F6FB0', 7, 5, 0, '英雄皮肤「银甲」', 'Heroes.dc.html'],
        ['不损失生命通关 10 关', I.tower, '#8A5A32', 4, 10, 0, '钻石 ×300', 'StageInfo.dc.html'],
        ['研究全部科技', I.hammer, '#6B5A45', 11, 30, 0, '头像框「大工匠」', 'Tech.dc.html'],
        ['累计消灭 100,000 个敌人', I.skull, '#4A3A48', 38420, 100000, 0, '称号「屠魔者」', 'Battle.dc.html']
      ]
    };
    var st = this.state;
    var tab = st.tab;
    var pre = tab.charAt(0);
    var fmt = function (n) { return n >= 10000 ? Math.round(n / 1000) + 'K' : n.toLocaleString('en-US'); };
    var list = DATA[tab].map(function (q, i) {
      var key = pre + i;
      var complete = q[3] >= q[4];
      var got = !!st.got[key];
      return {
        name: q[0], d: q[1], href: q[7], reward: q[6],
        prog: fmt(Math.min(q[3], q[4])) + '/' + fmt(q[4]),
        canClaim: complete && !got, canGo: !complete, done: got,
        card: 'flex-shrink: 0; border-radius: 12px; background: ' + (got ? '#E2CB98' : '#F3E4C0') + '; border: 3px solid #1E120A; box-shadow: inset 0 0 0 2px #E2CB98; padding: 8px 8px 8px 10px; display: flex; align-items: center; gap: 10px;',
        tile: 'width: 44px; height: 44px; flex-shrink: 0; border-radius: 10px; background: ' + q[2] + '; border: 2px solid #2A1A0E; box-sizing: border-box; display: flex; align-items: center; justify-content: center;',
        bar: 'width: ' + Math.min(100, q[3] / q[4] * 100) + '%; height: 100%; background: ' + (complete ? '#4E8A3A' : '#A8741A') + ';',
        claim: function () { var g = Object.assign({}, self.state.got); g[key] = true; self.setState({ got: g }); }
      };
    });
    var pts = 0;
    DATA.daily.forEach(function (q, i) { if (st.got['d' + i]) pts += q[5]; });
    pts = Math.min(100, pts);
    var marks = [25, 50, 75, 100].map(function (at) {
      var ok = pts >= at;
      return {
        at: at, body: ok ? '#E9B949' : '#8C8F96', lid: ok ? '#A8322A' : '#6B5A45',
        pos: 'position: absolute; top: 0; left: calc(' + at + '% - 44px); width: 44px; display: flex; flex-direction: column; align-items: center; gap: 2px;',
        box: 'width: 44px; height: 44px; border-radius: 10px; border: 2px solid #2A1A0E; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: ' + (ok ? '#FFE7A3' : '#3A2414') + ';'
      };
    });
    var tabs = [['daily', '每日'], ['weekly', '每周'], ['achieve', '成就']].map(function (d) {
      var on = d[0] === tab;
      return {
        label: d[1], on: on ? 'true' : 'false',
        pick: function () { self.setState({ tab: d[0] }); },
        style: 'height: 40px; border-radius: 10px 10px 4px 4px; border: 3px solid #1E120A; box-sizing: border-box; font-size: 15px; font-weight: 900; ' + (on ? 'background: #F3E4C0; color: #2A1A0E; box-shadow: inset 0 -3px 0 #E9B949;' : 'background: #5C3A21; color: #C9A96A;')
      };
    });
    return {
      tabs: tabs, list: list, points: pts, marks: marks,
      reset: tab === 'daily' ? '12:40:18 后刷新' : (tab === 'weekly' ? '3 天后刷新' : '永久')
    };
  }
}
</script>
</body>
</html>
