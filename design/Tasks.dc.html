<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>任务</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&amp;family=Noto+Sans+SC:wght@500;700;900&amp;family=ZCOOL+QingKe+HuangYou&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0E1024;font-family:"Noto Sans SC",system-ui,sans-serif;color:#FFFFFF}
button{font-family:inherit;cursor:pointer;margin:0;padding:0;border:0;background:none;color:inherit}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column; background: #1B1F3B; font-family: 'Noto Sans SC', system-ui, sans-serif; color: #FFFFFF">
  <!-- 标题栏 -->
  <div style="flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 12px 16px 0 16px">
    <a href="Main.dc.html" aria-label="返回主界面" style="width: 44px; height: 44px; border-radius: 12px; background: #2E3570; border: 3px solid #0E1024; box-shadow: 0 3px 0 #0E1024; box-sizing: border-box; display: flex; align-items: center; justify-content: center; text-decoration: none">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 L8 12 L15 19"></path></svg>
    </a>
    <h1 style="margin: 0; flex-grow: 1; font-family: 'ZCOOL QingKe HuangYou', 'Noto Sans SC', sans-serif; font-weight: 400; font-size: 34px; line-height: 36px; letter-spacing: 2px; text-shadow: 0 3px 0 #0E1024, 0 -2px 0 #0E1024, 2px 0 0 #0E1024, -2px 0 0 #0E1024">任务</h1>
    <span style="font-size: 12px; font-weight: 700; color: #C9CDF2">{{resetText}}</span>
  </div>

  <div role="tablist" style="flex-shrink: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 12px 16px 0 16px">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
      <button role="tab" aria-selected="{{t.on}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
    </sc-for>
  </div>

  <!-- 活跃度 -->
  <div style="flex-shrink: 0; margin: 12px 16px 0 16px; border-radius: 18px; background: #0E1024; padding: 12px 14px 8px 14px; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <span style="font-size: 14px; font-weight: 900">活跃度</span>
      <span style="font-family: 'Lilita One', sans-serif; font-size: 20px; color: #FFE08A">{{points}}<span style="font-size: 13px; color: #8E94C8"> / 100</span></span>
    </div>
    <div style="position: relative; height: 70px">
      <div style="position: absolute; left: 0; right: 22px; top: 18px; height: 10px; border-radius: 5px; background: #2E3570; overflow: hidden">
        <div style="width: {{points}}%; height: 100%; border-radius: 5px; background: #3DDC84"></div>
      </div>
      <sc-for list="{{marks}}" as="m" hint-placeholder-count="5">
        <div style="{{m.pos}}">
          <span style="{{m.box}}">
            <svg width="26" height="24" viewBox="0 0 30 28">
              <rect x="3" y="11" width="24" height="15" rx="3" fill="{{m.body}}" stroke="#0E1024" stroke-width="2.5"></rect>
              <path d="M3 13 Q3 4 15 4 Q27 4 27 13 Z" fill="{{m.lid}}" stroke="#0E1024" stroke-width="2.5" stroke-linejoin="round"></path>
            </svg>
          </span>
          <span style="font-family: 'Lilita One', sans-serif; font-size: 12px; color: #C9CDF2">{{m.at}}</span>
        </div>
      </sc-for>
    </div>
  </div>

  <!-- 任务列表 -->
  <div style="flex-grow: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; padding: 12px 16px 20px 16px; display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{list}}" as="q" hint-placeholder-count="8">
      <div style="{{q.card}}">
        <span style="{{q.tile}}">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="{{q.d}}"></path></svg>
        </span>
        <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px">
          <span style="font-size: 14px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{q.name}}</span>
          <div style="display: flex; align-items: center; gap: 6px">
            <div style="flex-grow: 1; height: 10px; border-radius: 5px; background: #0E1024; overflow: hidden">
              <div style="{{q.bar}}"></div>
            </div>
            <span style="font-family: 'Lilita One', sans-serif; font-size: 12px; color: #C9CDF2; white-space: nowrap">{{q.progText}}</span>
          </div>
          <span style="font-size: 11px; font-weight: 700; color: #FFE08A">活跃 +{{q.pts}} · {{q.reward}}</span>
        </div>
        <sc-if value="{{q.canClaim}}" hint-placeholder-val="{{false}}">
          <button onClick="{{q.claim}}" style="flex-shrink: 0; width: 72px; height: 44px; border-radius: 12px; background: #3DDC84; color: #0E1024; border: 3px solid #0E1024; box-shadow: 0 3px 0 #0E1024; box-sizing: border-box; font-size: 15px; font-weight: 900">领取</button>
        </sc-if>
        <sc-if value="{{q.canGo}}" hint-placeholder-val="{{true}}">
          <a href="{{q.href}}" style="flex-shrink: 0; width: 72px; height: 44px; border-radius: 12px; background: #4F8BFF; color: #FFFFFF; border: 3px solid #0E1024; box-shadow: 0 3px 0 #0E1024; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 900; text-decoration: none">前往</a>
        </sc-if>
        <sc-if value="{{q.isDone}}" hint-placeholder-val="{{false}}">
          <span style="flex-shrink: 0; width: 72px; height: 44px; border-radius: 12px; background: #0E1024; color: #8E94C8; display: flex; align-items: center; justify-content: center; gap: 2px; font-size: 13px; font-weight: 900">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#3DDC84" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12 L10 17 L19 7"></path></svg>已领
          </span>
        </sc-if>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'daily', claimed: { d0: true, d1: true, d2: true }, bonus: 0 };
  }
  renderVals() {
    var self = this;
    var ICON = {
      login: 'M3 5 H21 V19 H3 Z M3 10 H21 M8 3 V7 M16 3 V7',
      battle: 'M4 4 L14 14 M4 4 H8 L16 12 M4 4 V8 L12 16 M20 4 L10 14 M20 4 H16 M20 4 V8',
      skull: 'M5 11 A7 7 0 0 1 19 11 V15 H16 V19 H8 V15 H5 Z',
      clock: 'M12 3 A9 9 0 1 0 12.01 3 Z M12 7 V12 L15 14',
      up: 'M12 20 V8 M7 12 L12 7 L17 12 M5 4 H19',
      shop: 'M4 8 H20 L19 21 H5 Z M8 8 V6 A4 4 0 0 1 16 6 V8',
      gear: 'M12 3 L20 6 V11 C20 16 16.5 19.5 12 21 C7.5 19.5 4 16 4 11 V6 Z',
      chest: 'M3 10 H21 V20 H3 Z M3 10 Q3 4 12 4 Q21 4 21 10 M10 10 H14 V14 H10 Z',
      trophy: 'M7 4 H17 V9 A5 5 0 0 1 7 9 Z M12 14 V18 M8 21 H16',
      star: 'M12 2 L14.9 8.6 L22 9.3 L16.6 14 L18.2 21 L12 17.3 L5.8 21 L7.4 14 L2 9.3 L9.1 8.6 Z'
    };
    var DATA = {
      daily: [
        { name: '每日登录', d: ICON.login, c: '#FF8A3D', cur: 1, max: 1, pts: 10, reward: '金币 ×5K', href: 'Main.dc.html' },
        { name: '进行 3 次章节战斗', d: ICON.battle, c: '#E84A5F', cur: 3, max: 3, pts: 20, reward: '钻石 ×20', href: 'Main.dc.html' },
        { name: '累计击杀 1,000 个敌人', d: ICON.skull, c: '#8E4FE0', cur: 1000, max: 1000, pts: 20, reward: '图纸 ×3', href: 'Battle.dc.html' },
        { name: '领取 2 次巡逻收益', d: ICON.clock, c: '#3D6FE0', cur: 2, max: 2, pts: 10, reward: '金币 ×8K', href: 'Main.dc.html' },
        { name: '升级任意装备 1 次', d: ICON.gear, c: '#2FB36B', cur: 1, max: 1, pts: 10, reward: '强化石 ×5', href: 'Gear.dc.html' },
        { name: '升级天赋 1 次', d: ICON.up, c: '#E0A020', cur: 0, max: 1, pts: 10, reward: '金币 ×5K', href: 'Evolve.dc.html' },
        { name: '在商店购买 1 次商品', d: ICON.shop, c: '#4F8BFF', cur: 0, max: 1, pts: 10, reward: '钻石 ×10', href: 'Shop.dc.html' },
        { name: '完成 1 次每日挑战', d: ICON.trophy, c: '#D93C4A', cur: 0, max: 1, pts: 20, reward: '史诗碎片', href: 'Modes.dc.html' }
      ],
      weekly: [
        { name: '本周登录 5 天', d: ICON.login, c: '#FF8A3D', cur: 4, max: 5, pts: 20, reward: '钻石 ×100', href: 'Main.dc.html' },
        { name: '本周击杀 20,000 个敌人', d: ICON.skull, c: '#8E4FE0', cur: 20000, max: 20000, pts: 20, reward: '史诗宝箱', href: 'Battle.dc.html' },
        { name: '开启 10 次宝箱', d: ICON.chest, c: '#E0A020', cur: 6, max: 10, pts: 20, reward: '钥匙 ×2', href: 'Shop.dc.html' },
        { name: '竞技场挑战 5 次', d: ICON.trophy, c: '#D93C4A', cur: 2, max: 5, pts: 20, reward: '竞技币 ×300', href: 'Modes.dc.html' },
        { name: '合成 3 件装备', d: ICON.gear, c: '#2FB36B', cur: 3, max: 3, pts: 20, reward: '传说碎片', href: 'Gear.dc.html' }
      ],
      achieve: [
        { name: '通关第 3 章', d: ICON.star, c: '#E0A020', cur: 1, max: 1, pts: 0, reward: '钻石 ×300', href: 'Main.dc.html' },
        { name: '累计击杀 100,000 个敌人', d: ICON.skull, c: '#8E4FE0', cur: 68240, max: 100000, pts: 0, reward: '称号「屠夫」', href: 'Battle.dc.html' },
        { name: '拥有 1 件神话装备', d: ICON.gear, c: '#D93C4A', cur: 1, max: 1, pts: 0, reward: '头像框', href: 'Gear.dc.html' },
        { name: '天赋等级达到 20', d: ICON.up, c: '#2FB36B', cur: 7, max: 20, pts: 0, reward: '钻石 ×500', href: 'Evolve.dc.html' },
        { name: '无尽模式生存 30 分钟', d: ICON.clock, c: '#3D6FE0', cur: 23, max: 30, pts: 0, reward: '限定皮肤', href: 'Modes.dc.html' },
        { name: '连续登录 30 天', d: ICON.login, c: '#FF8A3D', cur: 12, max: 30, pts: 0, reward: '钻石 ×1000', href: 'Main.dc.html' }
      ]
    };
    var tab = this.state.tab;
    var claimed = this.state.claimed;
    var prefix = tab.charAt(0);
    var fmt = function (n) { return n >= 10000 ? (n / 1000).toFixed(0) + 'K' : String(n); };
    var list = DATA[tab].map(function (q, i) {
      var key = prefix + i;
      var complete = q.cur >= q.max;
      var got = !!claimed[key];
      return {
        name: q.name, d: q.d, pts: q.pts, reward: q.reward, href: q.href,
        progText: fmt(Math.min(q.cur, q.max)) + '/' + fmt(q.max),
        canClaim: complete && !got, canGo: !complete, isDone: got,
        card: 'flex-shrink: 0; border-radius: 16px; background: #2E3570; border: 3px solid #0E1024; box-shadow: 0 3px 0 #0E1024; padding: 10px; display: flex; align-items: center; gap: 10px;' + (got ? ' opacity: 0.65;' : ''),
        tile: 'width: 48px; height: 48px; flex-shrink: 0; border-radius: 12px; border: 3px solid #0E1024; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: ' + q.c + ';',
        bar: 'width: ' + Math.min(100, q.cur / q.max * 100) + '%; height: 100%; border-radius: 5px; background: ' + (complete ? '#3DDC84' : '#FFC93C') + ';',
        claim: function () {
          var c = Object.assign({}, self.state.claimed); c[key] = true;
          self.setState({ claimed: c });
        }
      };
    });
    var pts = 0;
    DATA.daily.forEach(function (q, i) { if (claimed['d' + i]) pts += q.pts; });
    pts = Math.min(100, pts);
    var marks = [20, 40, 60, 80, 100].map(function (at, i) {
      var reached = pts >= at;
      return {
        at: at,
        body: reached ? '#FF8A3D' : '#8E94C8', lid: reached ? '#E84A5F' : '#6A70A8',
        pos: 'position: absolute; top: 0; left: calc(' + at + '% - 44px); width: 44px; display: flex; flex-direction: column; align-items: center; gap: 2px;',
        box: 'width: 44px; height: 44px; border-radius: 12px; border: 3px solid #0E1024; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: ' + (reached ? '#FFC93C' : '#1B1F3B') + ';' + (reached ? ' box-shadow: 0 0 0 2px #FFE08A;' : '')
      };
    });
    var tabs = [ ['daily', '每日'], ['weekly', '每周'], ['achieve', '成就'] ].map(function (d) {
      var on = d[0] === tab;
      return {
        label: d[1], on: on ? 'true' : 'false',
        pick: function () { self.setState({ tab: d[0] }); },
        style: 'height: 40px; border-radius: 12px; border: 3px solid #0E1024; box-sizing: border-box; font-size: 15px; font-weight: 900; ' + (on ? 'background: #FFC93C; color: #3A2400; box-shadow: 0 3px 0 #7A4A00;' : 'background: #2E3570; color: #C9CDF2; box-shadow: 0 3px 0 #0E1024;')
      };
    });
    return {
      tabs: tabs, list: list, points: pts, marks: marks,
      resetText: tab === 'weekly' ? '4天 12时后重置' : (tab === 'achieve' ? '永久有效' : '14:32:08 后重置')
    };
  }
}
</script>
</body>
</html>
