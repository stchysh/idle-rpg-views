<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>战斗结算</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&amp;family=Noto+Sans+SC:wght@500;700;900&amp;family=ZCOOL+QingKe+HuangYou&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0E1024;font-family:"Noto Sans SC",system-ui,sans-serif;color:#FFFFFF}
button{font-family:inherit;cursor:pointer;margin:0;padding:0;border:0;background:none;color:inherit}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; background: #1B1F3B; font-family: 'Noto Sans SC', system-ui, sans-serif; color: #FFFFFF; box-sizing: border-box; padding: 24px 16px 20px 16px; gap: 12px">
  <div style="position: absolute; left: 45px; top: 30px; width: 300px; height: 300px; border-radius: 50%; background: #2A3068"></div>

  <!-- 胜利标题 -->
  <div style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px">
    <svg width="190" height="60" viewBox="0 0 220 70">
      <g stroke="#0E1024" stroke-width="3.5" stroke-linejoin="round">
        <path d="M40 58 L48 34 L66 30 L74 50 Z" fill="#8E94C8"></path>
        <path d="M180 58 L172 34 L154 30 L146 50 Z" fill="#8E94C8"></path>
        <path d="M110 4 L121 27 L146 30 L127 47 L132 72 L110 59 L88 72 L93 47 L74 30 L99 27 Z" fill="#FFC93C" transform="translate(0 -6) scale(1)"></path>
        <path d="M60 12 L66 25 L80 27 L69 36 L72 50 L60 43 L48 50 L51 36 L40 27 L54 25 Z" fill="#FFC93C"></path>
        <path d="M160 12 L166 25 L180 27 L169 36 L172 50 L160 43 L148 50 L151 36 L140 27 L154 25 Z" fill="#FFC93C"></path>
      </g>
    </svg>
    <h1 style="margin: 0; font-family: 'ZCOOL QingKe HuangYou', 'Noto Sans SC', sans-serif; font-weight: 400; font-size: 52px; line-height: 54px; letter-spacing: 6px; color: #FFC93C; text-shadow: 0 5px 0 #0E1024, 0 -3px 0 #0E1024, 3px 0 0 #0E1024, -3px 0 0 #0E1024">通关成功</h1>
    <span style="font-size: 14px; font-weight: 700; color: #C9CDF2">第 3 章 · 熔岩荒漠</span>
    <span style="margin-top: 2px; padding: 0 12px; height: 26px; line-height: 26px; border-radius: 13px; background: #E84A5F; border: 2px solid #0E1024; font-size: 13px; font-weight: 900">新纪录！</span>
  </div>

  <!-- 数据 -->
  <div style="position: relative; width: 100%; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
    <div style="height: 70px; border-radius: 16px; background: #0E1024; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
      <span style="font-size: 12px; color: #C9CDF2">生存时间</span>
      <span style="font-family: 'Lilita One', sans-serif; font-size: 22px">15:00</span>
    </div>
    <div style="height: 70px; border-radius: 16px; background: #0E1024; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
      <span style="font-size: 12px; color: #C9CDF2">击杀数</span>
      <span style="font-family: 'Lilita One', sans-serif; font-size: 22px">2,316</span>
    </div>
    <div style="height: 70px; border-radius: 16px; background: #0E1024; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
      <span style="font-size: 12px; color: #C9CDF2">最高等级</span>
      <span style="font-family: 'Lilita One', sans-serif; font-size: 22px">Lv.28</span>
    </div>
  </div>

  <!-- 技能伤害排行 -->
  <div style="position: relative; width: 100%; box-sizing: border-box; border-radius: 18px; background: #2E3570; border: 3px solid #0E1024; padding: 12px; display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 14px; font-weight: 900">伤害统计</span>
    <sc-for list="{{dmg}}" as="d" hint-placeholder-count="4">
      <div style="display: flex; align-items: center; gap: 8px">
        <span style="width: 72px; flex-shrink: 0; font-size: 12px; font-weight: 700">{{d.name}}</span>
        <div style="flex-grow: 1; height: 12px; border-radius: 6px; background: #0E1024; overflow: hidden">
          <div style="{{d.bar}}"></div>
        </div>
        <span style="width: 56px; text-align: right; font-family: 'Lilita One', sans-serif; font-size: 13px">{{d.val}}</span>
      </div>
    </sc-for>
  </div>

  <!-- 奖励 -->
  <div style="position: relative; width: 100%; box-sizing: border-box; border-radius: 18px; background: #2E3570; border: 3px solid #0E1024; padding: 12px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <span style="font-size: 14px; font-weight: 900">获得奖励</span>
      <span style="font-size: 12px; color: #C9CDF2">{{mult}}</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{rewards}}" as="r" hint-placeholder-count="10">
        <div style="{{r.tile}}">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="{{r.d}}"></path></svg>
          <span style="position: absolute; right: 3px; bottom: 1px; font-family: 'Lilita One', sans-serif; font-size: 11px; text-shadow: 0 1px 0 #0E1024, 1px 0 0 #0E1024, -1px 0 0 #0E1024">{{r.qty}}</span>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="flex-grow: 1"></div>

  <!-- 操作 -->
  <div style="position: relative; width: 100%; display: flex; flex-direction: column; gap: 10px">
    <sc-if value="{{canDouble}}" hint-placeholder-val="{{true}}">
      <button onClick="{{double}}" style="height: 56px; border-radius: 16px; background: #3DDC84; color: #0E1024; border: 4px solid #0E1024; box-shadow: 0 4px 0 #0E1024; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 18px; font-weight: 900">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0E1024" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"></rect><path d="M10 9 L15 12 L10 15 Z" fill="#0E1024"></path></svg>
        看广告 双倍领取
      </button>
    </sc-if>
    <div style="display: flex; gap: 10px">
      <a href="Battle.dc.html" style="flex-grow: 1; flex-basis: 0; height: 56px; border-radius: 16px; background: #4F8BFF; border: 4px solid #0E1024; box-shadow: 0 4px 0 #0E1024; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 900; text-decoration: none; color: #FFFFFF">再来一局</a>
      <a href="Main.dc.html" style="flex-grow: 1; flex-basis: 0; height: 56px; border-radius: 16px; background: #FFC93C; color: #3A2400; border: 4px solid #0E1024; box-shadow: 0 4px 0 #7A4A00; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 900; text-decoration: none">返回主页</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { doubled: false };
  }
  renderVals() {
    var self = this;
    var k = this.state.doubled ? 2 : 1;
    var fmt = function (n) { return n >= 1000 ? (n / 1000).toFixed(n >= 10000 ? 0 : 1) + 'K' : String(n); };
    var R = { green: '#2FB36B', blue: '#3D6FE0', purple: '#8E4FE0', yellow: '#E0A020', red: '#D93C4A', grey: '#6A70A8' };
    var list = [
      { d: 'M12 3 A9 9 0 1 0 12.01 3 Z M12 7 V17 M9 9 H14 M9 15 H14', n: 18600, c: 'yellow' },
      { d: 'M6 3 H18 L22 9 L12 21 L2 9 Z', n: 60, c: 'blue' },
      { d: 'M12 2 L14.9 8.6 L22 9.3 L16.6 14 L18.2 21 L12 17.3 L5.8 21 L7.4 14 L2 9.3 L9.1 8.6 Z', n: 2400, c: 'green' },
      { d: 'M6 3 H18 V21 H6 Z M9 8 H15 M9 12 H15 M9 16 H13', n: 6, c: 'blue' },
      { d: 'M6 3 H18 V21 H6 Z M9 8 H15 M9 12 H15 M9 16 H13', n: 2, c: 'purple' },
      { d: 'M20 4 L10 14 M20 4 H15 M20 4 V9 M7 13 L11 17 M9 15 L4 20', n: 1, c: 'purple' },
      { d: 'M7 3 L12 5 L17 3 L21 7 L18 10 V21 H6 V10 L3 7 Z', n: 1, c: 'blue' },
      { d: 'M12 3 L20 9 L17 20 H7 L4 9 Z M4 9 H20', n: 12, c: 'green' },
      { d: 'M3 10 H21 V20 H3 Z M3 10 Q3 4 12 4 Q21 4 21 10 M10 10 H14 V14 H10 Z', n: 1, c: 'yellow' },
      { d: 'M5 3 Q12 16 19 3 M12 13 L15 17 L12 21 L9 17 Z', n: 1, c: 'grey' }
    ];
    var rewards = list.map(function (r) {
      return {
        d: r.d, qty: '×' + fmt(r.n * k),
        tile: 'position: relative; aspect-ratio: 1 / 1; border-radius: 12px; border: 3px solid #0E1024; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: ' + R[r.c] + ';' + (r.c === 'yellow' || r.c === 'purple' ? ' box-shadow: 0 0 0 2px #FFE08A;' : '')
      };
    });
    var dmgs = [ ['冲锋枪', 42, '#D93C4A'], ['守卫者', 28, '#3D6FE0'], ['闪电发射器', 18, '#E0A020'], ['无人机', 12, '#8E4FE0'] ];
    var dmg = dmgs.map(function (d) {
      return { name: d[0], val: d[1] + '%', bar: 'width: ' + (d[1] / 42 * 100) + '%; height: 100%; border-radius: 6px; background: ' + d[2] + ';' };
    });
    return {
      rewards: rewards, dmg: dmg,
      canDouble: !this.state.doubled,
      mult: this.state.doubled ? '已双倍' : '可双倍领取',
      double: function () { self.setState({ doubled: true }); }
    };
  }
}
</script>
</body>
</html>
